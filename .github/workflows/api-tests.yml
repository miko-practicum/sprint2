name: API Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: Run Postman API tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start application
        run: docker compose up --detach --build

      - name: Wait for Kafka and HTTP services
        shell: bash
        run: |
          kafka_ready=false
          for attempt in {1..60}; do
            if docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              kafka_ready=true
              break
            fi
            echo "Waiting for Kafka (attempt ${attempt}/60)..."
            sleep 5
          done

          if [[ "${kafka_ready}" != "true" ]]; then
            echo "Kafka did not become ready in time"
            exit 1
          fi

          endpoints=(
            "http://localhost:8080/health"
            "http://localhost:8081/api/movies/health"
            "http://localhost:8082/api/events/health"
            "http://localhost:8000/health"
          )

          for endpoint in "${endpoints[@]}"; do
            endpoint_ready=false
            for attempt in {1..60}; do
              if curl --fail --silent --show-error "${endpoint}" >/dev/null; then
                endpoint_ready=true
                break
              fi
              echo "Waiting for ${endpoint} (attempt ${attempt}/60)..."
              sleep 5
            done

            if [[ "${endpoint_ready}" != "true" ]]; then
              echo "${endpoint} did not become ready in time"
              exit 1
            fi
          done

      - name: Run Postman tests
        run: bash tests/postman/run-tests.sh --docker --environment docker --reporters cli

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application
        if: always()
        run: docker compose down --volumes --remove-orphans
